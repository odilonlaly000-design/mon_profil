<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande | Odilon Laly</title>

<style>
body{margin:0;font-family:Arial;background:#fff;color:#333;}
header{background:#0f172a;color:white;text-align:center;padding:40px;}
section{padding:30px;max-width:900px;margin:auto;}
h2{color:#0f172a;}
input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:5px;border:1px solid #ccc;}
button{background:#0f172a;color:white;padding:12px;border:none;width:100%;border-radius:5px;}
.whatsapp{position:fixed;bottom:20px;right:20px;background:#25D366;color:white;padding:12px;border-radius:50px;text-decoration:none;}
.cta{background:#facc15;padding:15px;text-align:center;border-radius:5px;margin-top:15px;font-weight:bold;}
</style>
</head>

<body>

<header>
<h1>🚀 Lance ton projet digital</h1>
<p>Sites web • Logos • Contenus • IA</p>
</header>

<section>
<h2>Commande rapide</h2>

<p style="color:red;font-weight:bold;">
⚠️ Après validation, WhatsApp va s’ouvrir pour confirmer votre commande
</p>

<div class="cta">
🔥 Réponse rapide + suivi personnalisé
</div>

<form id="form">

<input type="text" name="name" placeholder="Nom complet" required>
<input type="email" name="email" placeholder="Email" required>
<input type="text" name="country" placeholder="Pays" required>
<input type="text" name="whatsapp" placeholder="Ton WhatsApp" required>

<textarea name="message" placeholder="Décris ta commande..." required></textarea>

<button type="submit">Commander maintenant</button>

</form>
</section>

<a class="whatsapp" href="https://wa.me/2290150510966">💬</a>

<script>
document.getElementById("form").addEventListener("submit", function(e){
e.preventDefault();

let f = e.target;

let msg = `Bonjour 👋

Je viens de faire une commande :

👤 Nom : ${f.name.value}
📧 Email : ${f.email.value}
🌍 Pays : ${f.country.value}
📱 WhatsApp : ${f.whatsapp.value}

📝 Détails :
${f.message.value}

Je souhaite payer maintenant.`;

let url = "https://wa.me/2290150510966?text=" + encodeURIComponent(msg);

window.location.href = url;
});
</script>

</body>
</html>
